networks:
  default: 
    driver: bridge
    name: roboshop
    # external: true

services:
  mongodb: 
    image: aneelp/mongodb:v1
    container_name: mongodb
    # volumes: 
    #   - mongodb/data/db

  catalogue:
    image: aneelp/catalogue:v1
    container_name: catalogue
    depends_on:
      - mongodb
  
  redis:
    image: redis:7
    container_name: redis

  user:
    image: aneelp/user:v1
    container_name: user
    depends_on:
      - redis
      - mongodb
  
  cart:
    image: aneelp/cart:v1
    container_name: cart
    depends_on:
      - catalogue
      - redis
  
  mysql:
    image: aneelp/sql:v1
    container_name: sql
  
  shipping:
    image: aneelp/shipping:v1
    container_name: shipping
    depends_on:
      - sql
      - cart


    # volumes: 
    #   - catalogue/data/db


